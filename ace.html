<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACE — Authoritative Company Explainer</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <img src="assets/wfsl-logo.jpg" alt="WFSL Logo" class="wfsl-logo" />
      <div class="brand-text">
        <h1>ACE</h1>
        <p class="tagline">Authoritative Company Explainer</p>
      </div>
    </div>

    <nav class="top-nav">
      <a href="./index.html">Home</a>
      <a class="active" href="./ace.html">ACE</a>
      <a href="./engage.html">Engage</a>
      <a href="./compliance.html">Compliance</a>
    </nav>
  </div>
</header>

<main class="page">
  <section class="card card-wide">
    <h2>Ask ACE</h2>
    <p class="muted">Governed explainer. No tracking. No storage.</p>

    <div id="chatLog" class="chat-log">
      <div class="msg ace">
        <div class="meta">ACE</div>
        <div class="bubble">
          Hello. Ask about Wynergy Fibre Solutions Ltd, how we operate, or how engagement works.
        </div>
      </div>
    </div>

    <form id="chatForm" class="chat-input">
      <input
        id="userInput"
        type="text"
        placeholder="Type your question and press Enter…"
        autocomplete="off"
        required
      />
    </form>

    <div class="footer-row">
      <a class="link" href="./index.html">Return home</a>
      <a class="link" href="./engage.html">Engage professionally</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  © Wynergy Fibre Solutions Ltd. Governed disclosure.
</footer>

<script>
  const chatLog = document.getElementById("chatLog");
  const chatForm = document.getElementById("chatForm");
  const userInput = document.getElementById("userInput");

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, m =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;" }[m])
    );
  }

  function addMessage(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = role === "user" ? "You" : "ACE";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = escapeHtml(text);

    el.appendChild(meta);
    el.appendChild(bubble);
    chatLog.appendChild(el);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function localAceReply(input) {
    const q = input.toLowerCase();

    if (q.includes("what") && q.includes("wfsl"))
      return "Wynergy Fibre Solutions Ltd is a UK infrastructure and systems company operating with a governance-first model.";

    if (q.includes("what") && q.includes("ace"))
      return "ACE is an Authoritative Company Explainer. It provides factual explanations only and does not give advice or make decisions.";

    if (q.includes("engage") || q.includes("contact"))
      return "Professional engagement is handled via the Engage page using explicit consent.";

    if (q.includes("why"))
      return "We operate with strict boundaries to protect governance, compliance, and long-term operational integrity.";

    return "I can explain our operations, governance model, or how to engage professionally.";
  }

  chatForm.addEventListener("submit", (e) => {
    e.preventDefault();

    const text = userInput.value.trim();
    if (!text) return;

    addMessage("user", text);
    userInput.value = "";

    // Always respond locally so the system never fails
    const reply = localAceReply(text);
    addMessage("ace", reply);
  });
</script>
</body>
</html>
