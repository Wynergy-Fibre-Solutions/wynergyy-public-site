<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ACE — Authoritative Company Explainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg0:#070a12;
      --bg1:#0b1020;
      --card:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.14);
      --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.65);
      --accent:#2dd4ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:radial-gradient(circle at top,var(--bg1),var(--bg0));
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    .wrap{
      max-width:860px;
      margin:48px auto;
      padding:24px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
    }
    h1{margin:0;font-size:22px}
    h2{margin:4px 0 16px 0;font-size:14px;color:var(--muted);font-weight:400}
    .chat{
      background:rgba(0,0,0,.45);
      border:1px solid var(--border);
      border-radius:14px;
      padding:16px;
      height:440px;
      overflow-y:auto;
    }
    .turn{margin-bottom:16px}
    .ace{
      background:rgba(255,255,255,.08);
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
    }
    .user{
      text-align:right;
      color:var(--accent);
      font-size:13px;
      margin-bottom:6px;
    }
    .choices{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }
    .choice{
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.35);
      color:var(--text);
      font-size:12px;
      cursor:pointer;
    }
    .proof{
      margin-top:8px;
      font-size:11px;
      color:var(--muted);
    }
    .proof a{
      color:var(--accent);
      text-decoration:none;
    }
    .input{
      display:flex;
      gap:8px;
      margin-top:12px;
    }
    .input input{
      flex:1;
      padding:12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(0,0,0,.4);
      color:var(--text);
      font-size:13px;
      outline:none;
    }
    .input button{
      padding:0 18px;
      border-radius:12px;
      border:none;
      background:var(--accent);
      color:#000;
      font-weight:600;
      cursor:pointer;
    }
    footer{
      margin-top:14px;
      font-size:11px;
      color:var(--muted);
      display:flex;
      justify-content:space-between;
    }
  </style>
</head>

<body>
<div class="wrap">
  <h1>ACE</h1>
  <h2>Authoritative Company Explainer</h2>

  <div id="chat" class="chat"></div>

  <div class="input">
    <input id="input" placeholder="Type or select an option" />
    <button id="send">Send</button>
  </div>

  <footer>
    <div>© Wynergy Fibre Solutions Ltd</div>
    <div>Governed disclosure</div>
  </footer>
</div>

<script>
let lastLane = null;

const PROOF = {
  "Telecoms delivery": {
    label: "Industry standards",
    url: "https://www.openreach.com/help-and-support/engineering"
  },
  "Governance & compliance": {
    label: "Regulatory framework",
    url: "https://www.ofcom.org.uk"
  },
  "Assets & licensing": {
    label: "Licensable capability",
    url: "https://github.com/Wynergyy"
  }
};

const LANES = {
  "About WFSL": {
    text: "WFSL designs and operates governance-first telecoms and infrastructure systems for regulated environments.",
    next: ["Telecoms delivery","Engagement","Governance & compliance"]
  },
  "Telecoms delivery": {
    text: "Delivery is structured, verified and governed across fibre, civils and infrastructure pathways.",
    next: ["Business value","Engagement","Governance & compliance"]
  },
  "Business value": {
    text: "WFSL reduces delivery risk, improves compliance confidence and provides licensable operational capability.",
    next: ["Assets & licensing","Engagement"]
  },
  "Governance & compliance": {
    text: "All engagement operates within lawful, auditable and controlled governance frameworks.",
    next: ["Assets & licensing","Engagement"]
  },
  "Assets & licensing": {
    text: "WFSL holds licensable software, process IP and workforce governance capability. Detailed disclosure occurs under NDA.",
    next: ["Engagement"]
  },
  "Engagement": {
    text: "Engagement is structured and governed. Architecture and outcomes are shared selectively.",
    next: ["Request NDA","Work with us"]
  },
  "Request NDA": {
    text: "NDA access is issued following a verified expression of interest.",
    next: ["Work with us","About WFSL"]
  },
  "Work with us": {
    text: "WFSL engages with contractors, engineers and partners through verified pathways. Intake is controlled.",
    next: ["Engagement","Telecoms delivery"]
  }
};

const DEFAULT = ["About WFSL","Engagement","Telecoms delivery","Governance & compliance"];

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");

function ace(text, choices, lane){
  const t=document.createElement("div");t.className="turn";
  const a=document.createElement("div");a.className="ace";a.textContent=text;
  t.appendChild(a);

  if(PROOF[lane]){
    const p=document.createElement("div");
    p.className="proof";
    p.innerHTML = `Reference: <a href="${PROOF[lane].url}" target="_blank" rel="noopener">${PROOF[lane].label}</a>`;
    a.appendChild(p);
  }

  if(choices){
    const c=document.createElement("div");c.className="choices";
    choices.forEach(l=>{
      const b=document.createElement("div");
      b.className="choice";
      b.textContent=l;
      b.onclick=()=>pick(l);
      c.appendChild(b);
    });
    a.appendChild(c);
  }

  chat.appendChild(t);
  chat.scrollTop=chat.scrollHeight;
}

function user(text){
  const t=document.createElement("div");t.className="turn";
  const u=document.createElement("div");u.className="user";u.textContent=text;
  t.appendChild(u);
  chat.appendChild(t);
  chat.scrollTop=chat.scrollHeight;
}

function pick(label){
  lastLane = label;
  user(label);
  const lane = LANES[label];
  ace(lane.text, lane.next, label);
}

function handle(){
  const v=input.value.trim();
  if(!v) return;
  input.value="";
  user(v);
  ace("To continue, choose a guided option.", lastLane ? LANES[lastLane].next : DEFAULT);
}

send.onclick=handle;
input.addEventListener("keydown",e=>{if(e.key==="Enter")handle();});

ace("Hello. Choose a topic to explore WFSL.", DEFAULT);
</script>
</body>
</html>
