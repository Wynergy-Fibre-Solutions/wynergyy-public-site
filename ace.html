<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ACE — Authoritative Company Explainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --blue:#1f3cff;
  --cyan:#2dd4ff;
  --green:#22c55e;
  --bg0:#070a12;
  --bg1:#0b1020;
  --card:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.14);
  --text:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.65);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(circle at 20% 10%,rgba(31,60,255,.08),transparent 40%),
    radial-gradient(circle at 80% 80%,rgba(45,212,255,.06),transparent 45%),
    linear-gradient(var(--bg1),var(--bg0));
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
.wrap{
  max-width:900px;
  margin:48px auto;
  padding:24px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.brand{
  display:flex;
  gap:14px;
  align-items:center;
}
.logo{
  width:44px;
  height:44px;
  border-radius:12px;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.logo img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}
h1{margin:0;font-size:22px}
h2{margin:4px 0 0 0;font-size:13px;font-weight:400;color:var(--muted)}
.status{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:12px;
  color:var(--muted);
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px rgba(34,197,94,.9);
}
.chat{
  height:460px;
  padding:16px;
  background:rgba(0,0,0,.45);
  border:1px solid var(--border);
  border-radius:16px;
  overflow-y:auto;
}
.turn{margin-bottom:16px}
.ace{
  background:rgba(255,255,255,.08);
  padding:12px 14px;
  border-radius:14px;
  font-size:13px;
}
.user{
  text-align:right;
  color:var(--cyan);
  font-size:13px;
  margin-bottom:6px;
}
.choices{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}
.choice{
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.35);
  font-size:12px;
  cursor:pointer;
}
.input{
  display:flex;
  gap:10px;
  margin-top:14px;
}
.input input{
  flex:1;
  padding:13px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.45);
  color:var(--text);
}
.input button{
  padding:0 20px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  font-weight:700;
}
footer{
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid var(--border);
  font-size:11px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>
<div class="wrap">

<header>
  <div class="brand">
    <div class="logo">
      <img src="/assets/wfsl-logo.jpg" alt="WFSL logo">
    </div>
    <div>
      <h1>ACE</h1>
      <h2>Authoritative Company Explainer</h2>
    </div>
  </div>
  <div class="status">
    <div class="dot"></div>
    ACE online
  </div>
</header>

<div id="chat" class="chat"></div>

<div class="input">
  <input id="input" placeholder="Type or select an option">
  <button id="send">Send</button>
</div>

<footer>
  <div>© Wynergy Fibre Solutions Ltd</div>
  <div>Governed disclosure</div>
</footer>

</div>

<script>
let lastLane=null;

const LANES={
  "About WFSL":{t:"WFSL designs and operates governance-first telecoms and infrastructure systems for regulated environments.",n:["Telecoms delivery","Engagement","Governance & compliance"]},
  "Telecoms delivery":{t:"Delivery is structured, verified and governed across fibre, civils and infrastructure pathways.",n:["Business value","Engagement","Governance & compliance"]},
  "Business value":{t:"WFSL reduces delivery risk and improves compliance confidence.",n:["Assets & licensing","Engagement"]},
  "Governance & compliance":{t:"All engagement operates within lawful, auditable governance frameworks.",n:["Assets & licensing","Engagement"]},
  "Assets & licensing":{t:"WFSL holds licensable software and operational IP. Disclosure occurs under NDA.",n:["Engagement"]},
  "Engagement":{t:"Engagement is structured and governed.",n:["Request NDA","Work with us"]},
  "Request NDA":{t:"NDA access is issued following verified interest.",n:["Work with us","About WFSL"]},
  "Work with us":{t:"WFSL engages with contractors and partners through verified pathways.",n:["Engagement","Telecoms delivery"]}
};

const DEFAULT=["About WFSL","Engagement","Telecoms delivery","Governance & compliance"];

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");

function ace(text,choices){
  const t=document.createElement("div");
  t.className="turn";
  const a=document.createElement("div");
  a.className="ace";
  a.textContent=text;
  t.appendChild(a);
  if(choices){
    const c=document.createElement("div");
    c.className="choices";
    choices.forEach(l=>{
      const b=document.createElement("div");
      b.className="choice";
      b.textContent=l;
      b.onclick=()=>pick(l);
      c.appendChild(b);
    });
    a.appendChild(c);
  }
  chat.appendChild(t);
  chat.scrollTop=chat.scrollHeight;
}

function user(text){
  const t=document.createElement("div");
  t.className="turn";
  const u=document.createElement("div");
  u.className="user";
  u.textContent=text;
  t.appendChild(u);
  chat.appendChild(t);
}

function pick(label){
  lastLane=label;
  user(label);
  ace(LANES[label].t,LANES[label].n);
}

function handle(){
  if(!input.value.trim())return;
  user(input.value);
  input.value="";
  ace("Choose a topic to continue.",lastLane?LANES[lastLane].n:DEFAULT);
}

send.onclick=handle;
input.onkeydown=e=>{if(e.key==="Enter")handle();};

ace("Hello. Choose a topic to explore WFSL.",DEFAULT);
</script>

</body>
</html>
