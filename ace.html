<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ACE — Authoritative Company Explainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.14);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --accent: #2dd4ff;
      --accent-strong: #1f3cff;
      --online: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a, #020617);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 820px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 40px 120px rgba(0,0,0,0.6);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
    }

    .brand h1 {
      font-size: 20px;
      margin: 0;
    }

    .brand span {
      display: block;
      font-size: 13px;
      color: var(--muted);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 8px var(--online);
    }

    .panel {
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      min-height: 320px;
    }

    .message {
      margin-bottom: 16px;
    }

    .message p {
      margin: 0 0 12px 0;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 1px rgba(45,212,255,0.15);
    }

    footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="card">
    <header>
      <div class="brand">
        <img src="./assets/wfsl-logo.jpg" alt="WFSL logo">
        <div>
          <h1>ACE</h1>
          <span>Authoritative Company Explainer</span>
        </div>
      </div>
      <div class="status">
        <span class="dot"></span>
        ACE online
      </div>
    </header>

    <div id="panel" class="panel"></div>

    <footer>
      <div>© Wynergy Fibre Solutions Ltd</div>
      <div>Governed disclosure</div>
    </footer>
  </div>

  <script>
    const panel = document.getElementById("panel");

    const nodes = {
      root: {
        text: "Hello. Choose a topic to explore WFSL.",
        options: [
          ["About WFSL", "about"],
          ["Engagement", "engagement"],
          ["Telecoms delivery", "telecoms"],
          ["Governance & compliance", "governance"]
        ]
      },

      about: {
        text: "WFSL designs and operates governance-first telecoms and infrastructure systems for regulated environments.",
        options: [
          ["Telecoms delivery", "telecoms"],
          ["Engagement", "engagement"],
          ["Back to start", "root"]
        ]
      },

      engagement: {
        text: "Engagement is structured and governed. Architecture and outcomes are shared selectively following verified interest.",
        options: [
          ["Work with us", "work"],
          ["Request NDA", "nda"],
          ["Back to start", "root"]
        ]
      },

      telecoms: {
        text: "Delivery is structured, verified and governed across fibre, civils and infrastructure pathways.",
        options: [
          ["Business value", "value"],
          ["Governance & compliance", "governance"],
          ["Back to start", "root"]
        ]
      },

      governance: {
        text: "All engagement operates within lawful, auditable and controlled governance frameworks.",
        options: [
          ["Regulatory framework", "regulatory"],
          ["Assets & licensing", "assets"],
          ["Back to start", "root"]
        ]
      },

      work: {
        text: "WFSL engages with contractors, engineers and partners through controlled intake pathways.",
        options: [
          ["Engagement", "engagement"],
          ["Back to start", "root"]
        ]
      },

      nda: {
        text: "NDA access is issued following a verified expression of interest.",
        options: [
          ["Engagement", "engagement"],
          ["Back to start", "root"]
        ]
      },

      value: {
        text: "WFSL reduces delivery risk, improves compliance confidence and provides licensable operational capability.",
        options: [
          ["Assets & licensing", "assets"],
          ["Back to start", "root"]
        ]
      },

      regulatory: {
        text: "WFSL aligns delivery with UK telecoms and infrastructure regulatory requirements, including Ofcom frameworks.",
        options: [
          ["Governance & compliance", "governance"],
          ["Back to start", "root"]
        ]
      },

      assets: {
        text: "WFSL develops proprietary operational assets and governance systems, disclosed selectively.",
        options: [
          ["Engagement", "engagement"],
          ["Back to start", "root"]
        ]
      }
    };

    function render(nodeKey) {
      const node = nodes[nodeKey];
      panel.innerHTML = "";

      const msg = document.createElement("div");
      msg.className = "message";
      msg.innerHTML = `<p>${node.text}</p>`;
      panel.appendChild(msg);

      const choices = document.createElement("div");
      choices.className = "choices";

      node.options.forEach(([label, target]) => {
        const btn = document.createElement("button");
        btn.textContent = label;
        btn.onclick = () => render(target);
        choices.appendChild(btn);
      });

      panel.appendChild(choices);
    }

    render("root");
  </script>
</body>
</html>
