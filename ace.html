<script>
  const chatLog = document.getElementById("chatLog");
  const userInput = document.getElementById("userInput");
  const statusEl = document.getElementById("status");
  const downloadBtn = document.getElementById("downloadBtn");

  const transcript = [];
  let lastTopic = null;

  const rules = [
    {
      keys: ["hello", "hi", "hey"],
      reply: "Hello. I can explain what WFSL does, how engagement works, or where to find compliance information."
    },
    {
      keys: ["yes", "ok", "okay"],
      reply: "Understood. Please ask a specific question such as “what is wfsl”, “how do I engage”, or “gdpr”."
    },
    {
      keys: ["what is wfsl", "what do you do", "who are you", "what is wynergy"],
      reply: "Wynergy Fibre Solutions Ltd is a UK fibre infrastructure contractor and workforce platform connecting skilled engineers to compliant fibre build projects."
    },
    {
      keys: ["what is ace", "ace"],
      reply: "ACE is an Authoritative Company Explainer. It provides governed, factual explanations. It does not give advice or make decisions."
    },
    {
      keys: ["engage", "contact", "email"],
      reply: "Professional engagement is handled via the Engage page. ACE v1 does not collect personal data."
    },
    {
      keys: ["gdpr", "privacy", "compliance"],
      reply: "ACE v1 does not store or process personal data. No cookies, tracking, profiling, or automated decision-making is used."
    }
  ];

  function nowStamp() {
    return new Date().toLocaleString();
  }

  function addMsg(role, text) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + (role === "You" ? "user" : "ace");

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = role + " • " + nowStamp();

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    wrap.appendChild(meta);
    wrap.appendChild(bubble);
    chatLog.appendChild(wrap);
    chatLog.scrollTop = chatLog.scrollHeight;

    transcript.push(`${meta.textContent}\n${role}: ${text}\n`);
    if (transcript.length > 1) downloadBtn.disabled = false;
  }

  function respond(input) {
    const t = input.toLowerCase();

    for (const r of rules) {
      if (r.keys.some(k => t.includes(k))) {
        lastTopic = r.keys[0];
        return r.reply;
      }
    }

    return "I did not understand that input. Please ask about WFSL, engagement, or compliance.";
  }

  userInput.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;

    const text = userInput.value.trim();
    if (!text) return;

    addMsg("You", text);
    const reply = respond(text);
    addMsg("ACE", reply);

    userInput.value = "";
    statusEl.textContent = "Press Enter to continue. Download saves locally only.";
  });

  downloadBtn.addEventListener("click", () => {
    const blob = new Blob([transcript.join("\n")], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "ace-v1-transcript.txt";
    a.click();
    URL.revokeObjectURL(url);
  });

  addMsg(
    "ACE",
    "Hello. I am ACE, the Authoritative Company Explainer for Wynergy Fibre Solutions Ltd. Ask about WFSL, engagement, or compliance."
  );
</script>
