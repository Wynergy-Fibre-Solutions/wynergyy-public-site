<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACE — Authoritative Company Explainer</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .chat-container {
      max-width: 960px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .chat-log {
      height: 420px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 16px;
      margin-bottom: 16px;
      background: #f7f8fc;
    }
    .chat-entry {
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .chat-entry.user {
      font-weight: 600;
    }
    .chat-entry.ace {
      color: #1f3cff;
    }
    .chat-input {
      display: flex;
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    .chat-input button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <img src="assets/wfsl-logo.jpg" alt="WFSL Logo" class="wfsl-logo" />
    <div class="brand-text">
      <h1>ACE</h1>
      <p class="tagline">Authoritative Company Explainer</p>
    </div>
    <nav class="top-nav">
      <a href="./index.html">Home</a>
      <a class="active" href="./ace.html">ACE</a>
      <a href="./engage.html">Engage</a>
      <a href="./compliance.html">Compliance</a>
    </nav>
  </div>
</header>

<main class="chat-container">
  <h2>Ask ACE</h2>
  <p>This is a governed explainer. No tracking. No storage. Informational only.</p>

  <div id="chatLog" class="chat-log">
    <div class="chat-entry ace">
      ACE: Hello. Ask about Wynergy Fibre Solutions Ltd, how we operate, or how engagement works.
    </div>
  </div>

  <div class="chat-input">
    <input id="userInput" type="text" placeholder="Type your question…" />
    <button onclick="sendMessage()">Send</button>
  </div>
</main>

<footer class="site-footer">
  © Wynergy Fibre Solutions Ltd. Governed disclosure.
</footer>

<script>
  async function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    const log = document.getElementById("chatLog");

    log.innerHTML += `<div class="chat-entry user">You: ${text}</div>`;
    log.innerHTML += `<div class="chat-entry ace">ACE: thinking…</div>`;
    log.scrollTop = log.scrollHeight;
    input.value = "";

    try {
      const res = await fetch("/api/ace", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      log.lastElementChild.innerHTML = `ACE: ${data.reply}`;
    } catch {
      log.lastElementChild.innerHTML =
        "ACE: Service unavailable. Please engage professionally.";
    }

    log.scrollTop = log.scrollHeight;
  }
</script>

</body>
</html>
