<script>
/* ============================================================
   ACE v1 — Governed Interaction Engine
   Deterministic. Bounded. Professional by design.
   ============================================================ */

const ACE_CONFIG = {
  allowedIntents: ["wfsl", "engagement", "compliance"],
  maxFailures: 3
};

let failureCount = 0;

/* ---------- Normalisation ---------- */
function normaliseInput(text) {
  return text
    .toLowerCase()
    .replace(/[^\w\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

/* ---------- Conduct Gate ---------- */
function detectMisconduct(text) {
  const insults = ["stupid", "idiot", "dumb", "moron"];
  const profanity = ["fuck", "shit", "cunt", "bastard"];

  for (const word of [...insults, ...profanity]) {
    if (text.includes(word)) {
      return true;
    }
  }
  return false;
}

/* ---------- Intent Classification ---------- */
function classifyIntent(text) {
  if (text.includes("wfsl")) return "wfsl";
  if (text.includes("engage") || text.includes("engagement")) return "engagement";
  if (text.includes("compliance") || text.includes("legal")) return "compliance";
  return "unknown";
}

/* ---------- Response Engine ---------- */
function aceRespond(userInput) {
  const input = normaliseInput(userInput);

  if (!input) {
    return "Please enter a question about WFSL, engagement, or compliance.";
  }

  if (detectMisconduct(input)) {
    failureCount++;
    return "This interface operates under professional and respectful use. You can ask about WFSL, engagement, or compliance.";
  }

  const intent = classifyIntent(input);

  switch (intent) {
    case "wfsl":
      failureCount = 0;
      return "WFSL designs and operates governance-first infrastructure systems for regulated and compliance-sensitive environments.";

    case "engagement":
      failureCount = 0;
      return "Engagement is structured and governed. Architecture and outcomes are shared. Core systems are disclosed selectively under NDA.";

    case "compliance":
      failureCount = 0;
      return "Compliance is central. Systems prioritise auditability, enforcement, traceability, and operational control.";

    default:
      failureCount++;
      if (failureCount === 1) {
        return "I did not understand that. Ask about WFSL, engagement, or compliance.";
      }
      if (failureCount === 2) {
        return "Example questions: What does WFSL do? How does engagement work? What compliance standards apply?";
      }
      return "Please use the navigation above or return home for structured information.";
  }
}

/* ---------- UI Hook ---------- */
document.getElementById("ace-input").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    const userText = e.target.value;
    e.target.value = "";

    appendMessage("You", userText);
    const reply = aceRespond(userText);
    appendMessage("ACE", reply);
  }
});

/* ---------- Message Renderer ---------- */
function appendMessage(sender, text) {
  const container = document.getElementById("ace-messages");
  const msg = document.createElement("div");
  msg.className = sender === "ACE" ? "ace-msg" : "user-msg";
  msg.textContent = text;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
}
</script>
