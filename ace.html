  <script>
    /* =========================================
       ACE v1.1 — Governed, Deterministic
       Timeline + Intent Carry-Forward
       ========================================= */

    let failureCount = 0;
    let lastIntent = null;

    function normaliseInput(text) {
      return text
        .toLowerCase()
        .replace(/[^\w\s]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function detectMisconduct(text) {
      const blocked = ["stupid", "idiot", "dumb", "moron", "fuck", "shit", "cunt"];
      return blocked.some(word => text.includes(word));
    }

    function classifyIntent(text) {
      if (text.includes("wfsl")) return "wfsl";
      if (text.includes("engage")) return "engagement";
      if (text.includes("compliance") || text.includes("legal")) return "compliance";
      return "unknown";
    }

    function isFollowUp(text) {
      return (
        text.includes("this") ||
        text.includes("that") ||
        text.includes("they") ||
        text.includes("what does this mean")
      );
    }

    function aceRespond(userInput) {
      const input = normaliseInput(userInput);

      if (!input) {
        return "Please enter a question about WFSL, engagement, or compliance.";
      }

      if (detectMisconduct(input)) {
        failureCount++;
        return "This interface operates under professional and respectful use. Ask about WFSL, engagement, or compliance.";
      }

      let intent = classifyIntent(input);

      if (intent === "unknown" && isFollowUp(input) && lastIntent) {
        intent = lastIntent;
      }

      if (intent === "wfsl") {
        lastIntent = "wfsl";
        failureCount = 0;
        return "WFSL designs and operates governance-first infrastructure systems for regulated and compliance-sensitive environments.";
      }

      if (intent === "engagement") {
        lastIntent = "engagement";
        failureCount = 0;
        return "Engagement is structured and governed. Architecture and outcomes are shared. Core systems are disclosed selectively under NDA.";
      }

      if (intent === "compliance") {
        lastIntent = "compliance";
        failureCount = 0;
        return "Compliance prioritises auditability, enforcement, traceability, and operational control across systems.";
      }

      failureCount++;
      if (failureCount === 1) {
        return "I did not understand that. Ask about WFSL, engagement, or compliance.";
      }
      if (failureCount === 2) {
        return "Example questions: What does WFSL do? How does engagement work? What compliance standards apply?";
      }
      return "Please use the navigation or return home for structured information.";
