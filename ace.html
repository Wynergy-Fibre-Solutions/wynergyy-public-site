<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ACE — Authoritative Company Explainer</title>
    <meta name="description" content="ACE: governed, deterministic company explainer for WFSL." />
    <style>
      :root{
        --wfsl-blue:#1f3cff;
        --wfsl-cyan:#2dd4ff;
        --wfsl-violet:#7c3aed;
        --bg0:#070a12;
        --bg1:#0b1020;
        --card:rgba(255,255,255,.06);
        --card2:rgba(255,255,255,.08);
        --border:rgba(255,255,255,.14);
        --text:rgba(255,255,255,.92);
        --muted:rgba(255,255,255,.62);
        --good:#22c55e;
        --shadow: 0 24px 60px rgba(0,0,0,.55);
        --r: 18px;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
        color:var(--text);
        background:
          radial-gradient(1100px 700px at 20% 15%, rgba(31,60,255,.20), transparent 60%),
          radial-gradient(900px 650px at 70% 20%, rgba(45,212,255,.16), transparent 55%),
          radial-gradient(1000px 700px at 55% 75%, rgba(124,58,237,.14), transparent 60%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        padding: 36px 18px;
      }
      .wrap{max-width:1040px;margin:0 auto;display:flex;justify-content:center}
      .panel{
        width:min(920px, 100%);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        overflow:hidden;
      }
      .header{
        display:flex;align-items:center;justify-content:space-between;
        padding: 18px 20px;
        border-bottom:1px solid rgba(255,255,255,.08);
        background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      }
      .brand{display:flex;align-items:center;gap:12px;min-width:0}
      .logo{
        width:42px;height:42px;border-radius:12px;flex:0 0 auto;
        background: rgba(255,255,255,.06);
        border:1px solid rgba(255,255,255,.10);
        overflow:hidden;
        display:grid;place-items:center;
      }
      .logo img{width:100%;height:100%;object-fit:cover;display:block}
      .title{min-width:0}
      .title h1{margin:0;font-size:18px;letter-spacing:.2px}
      .title p{margin:2px 0 0 0;font-size:12.5px;color:var(--muted)}
      .status{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
      .dot{
        width:9px;height:9px;border-radius:50%;
        background: var(--good);
        box-shadow: 0 0 0 4px rgba(34,197,94,.12);
      }
      .body{padding:18px 18px 12px}
      .chatbox{
        border-radius: var(--r);
        border: 1px solid rgba(255,255,255,.10);
        background: rgba(0,0,0,.20);
        padding: 14px;
        height: 520px;
        overflow:auto;
      }
      .row{display:flex;margin:10px 0}
      .row.ace{justify-content:flex-start}
      .row.user{justify-content:flex-end}
      .bubble{
        max-width: 82%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,.08);
        background: rgba(255,255,255,.06);
        line-height:1.35;
        font-size:14px;
        white-space:pre-wrap;
      }
      .row.user .bubble{
        background: rgba(31,60,255,.16);
        border-color: rgba(31,60,255,.35);
      }
      .tag{
        margin-left:10px;
        align-self:center;
        font-size:12px;
        color: rgba(45,212,255,.85);
        user-select:none;
      }
      .options{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
      .btn{
        appearance:none;border:1px solid rgba(255,255,255,.12);
        background: rgba(255,255,255,.04);
        color: var(--text);
        padding: 8px 12px;
        border-radius: 999px;
        cursor:pointer;
        font-size: 13px;
      }
      .btn:hover{border-color: rgba(45,212,255,.35)}
      .btn:active{transform: translateY(1px)}
      .inputbar{
        display:flex;gap:10px;align-items:center;
        margin-top: 12px;
        padding: 0 2px;
      }
      .input{
        flex:1;
        display:flex;
        border-radius: 14px;
        border:1px solid rgba(255,255,255,.12);
        background: rgba(0,0,0,.20);
        padding: 10px 12px;
      }
      input[type="text"]{
        width:100%;
        border:0;outline:0;
        background: transparent;
        color: var(--text);
        font-size: 14px;
      }
      .send{
        flex:0 0 auto;
        border-radius: 14px;
        padding: 10px 16px;
        border: 1px solid rgba(31,60,255,.45);
        background: linear-gradient(180deg, rgba(31,60,255,.55), rgba(31,60,255,.30));
        color: var(--text);
        cursor:pointer;
        font-weight:600;
      }
      .send:hover{border-color: rgba(45,212,255,.55)}
      .hint{
        margin: 8px 2px 0 2px;
        font-size: 12px;
        color: var(--muted);
      }
      .footer{
        display:flex;justify-content:space-between;gap:12px;
        padding: 10px 18px 16px;
        font-size:12px;color: rgba(255,255,255,.55);
      }
      a{color: rgba(45,212,255,.9);text-decoration:none}
      a:hover{text-decoration:underline}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel" role="application" aria-label="ACE governed explainer">
        <div class="header">
          <div class="brand">
            <div class="logo" aria-label="WFSL logo">
              <img src="/assets/wfsl-logo.jpg" alt="WFSL logo" />
            </div>
            <div class="title">
              <h1>ACE</h1>
              <p>Authoritative Company Explainer</p>
            </div>
          </div>
          <div class="status" aria-label="ACE status">
            <span class="dot" aria-hidden="true"></span>
            <span>ACE online</span>
          </div>
        </div>

        <div class="body">
          <div id="chat" class="chatbox" aria-live="polite"></div>

          <div class="inputbar">
            <div class="input">
              <input id="text" type="text" placeholder="Type a question or select an option" autocomplete="off" />
            </div>
            <button id="send" class="send" type="button">Send</button>
          </div>

          <div class="hint">Governed responses. Free text is mapped to approved topics.</div>
        </div>

        <div class="footer">
          <div>© Wynergy Fibre Solutions Ltd</div>
          <div>Governed disclosure</div>
        </div>
      </div>
    </div>

    <script type="module">
      import { createAceEngine } from "./engine/ace-engine.js";
      import { ACE_TREE } from "./engine/ace-tree.js";

      const chatEl = document.getElementById("chat");
      const textEl = document.getElementById("text");
      const sendEl = document.getElementById("send");

      const engine = createAceEngine({ tree: ACE_TREE });

      /** Render helpers */
      function scrollToBottom() {
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function addRow(who, bubbleText, tagText = "") {
        const row = document.createElement("div");
        row.className = "row " + who;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = bubbleText || "";

        row.appendChild(bubble);

        if (tagText) {
          const tag = document.createElement("div");
          tag.className = "tag";
          tag.textContent = tagText;
          row.appendChild(tag);
        }

        chatEl.appendChild(row);
        scrollToBottom();
      }

      function addOptions(options) {
        if (!options || !options.length) return;

        const row = document.createElement("div");
        row.className = "row ace";

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        const wrap = document.createElement("div");
        wrap.className = "options";

        for (const opt of options) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "btn";
          b.textContent = opt.label;
          b.addEventListener("click", () => {
            // user chose an option
            addRow("user", opt.label);
            const r = engine.choose(opt.target, { via: "button" });
            renderView(r.view, opt.label);
          });
          wrap.appendChild(b);
        }

        bubble.appendChild(wrap);
        row.appendChild(bubble);
        chatEl.appendChild(row);
        scrollToBottom();
      }

      function renderView(view, tagLabel = "") {
        // One ACE response per state.
        addRow("ace", view.text, tagLabel ? String(tagLabel) : "");
        addOptions(view.options);
      }

      /** Input handling */
      function sendText() {
        const v = String(textEl.value || "").trim();
        if (!v) return;

        addRow("user", v);
        textEl.value = "";

        const r = engine.text(v, { via: "text" });
        renderView(r.view, "");
      }

      // FIX: Send button must always fire
      sendEl.addEventListener("click", (e) => {
        e.preventDefault();
        sendText();
        textEl.focus();
      });

      // FIX: Enter key must send (no dead input state)
      textEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendText();
        }
      });

      // Boot
      const boot = engine.start();
      renderView(boot.view, "");
      textEl.focus();
    </script>
  </body>
</html>
